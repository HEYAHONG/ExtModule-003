name: ubuntu cmake firmware build

on:
  push:
    tags: [testing]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    name: Discover firmware projects
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.find.outputs.projects }}
    steps:
      - uses: actions/checkout@v5

      - name: Find FW projects with a GCC directory
        id: find
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          projects=()
          for dir in FW/[0-9]*-*; do
            [[ -d "$dir" && -d "$dir/GCC" ]] || continue
            projects+=("$(basename "$dir")")
          done

          if ((${#projects[@]} == 0)); then
            echo 'projects=[]' >> "$GITHUB_OUTPUT"
            echo "No firmware project containing a GCC directory was found."
          else
            json="$(printf '%s\n' "${projects[@]}" | jq -Rsc 'split("\n") | map(select(length > 0))')"
            echo "projects=${json}" >> "$GITHUB_OUTPUT"
            printf 'Discovered firmware projects: %s\n' "${projects[*]}"
          fi

  build:
    name: Build ${{ matrix.project }}
    needs: discover
    if: needs.discover.outputs.projects != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.discover.outputs.projects) }}
    steps:
      - uses: actions/checkout@v5

      - name: Install build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi

      - name: Configure ${{ matrix.project }}
        env:
          PROJECT: ${{ matrix.project }}
        run: |
          cmake \
            -S "FW/${PROJECT}/GCC" \
            -B "${RUNNER_TEMP}/build/${PROJECT}"

      - name: Build ${{ matrix.project }}
        env:
          PROJECT: ${{ matrix.project }}
        run: cmake --build "${RUNNER_TEMP}/build/${PROJECT}" --parallel

      - name: Package ${{ matrix.project }}
        env:
          PROJECT: ${{ matrix.project }}
        shell: bash
        run: |
          set -euo pipefail

          build_dir="${RUNNER_TEMP}/build/${PROJECT}"
          dist_dir="${RUNNER_TEMP}/dist"
          mkdir -p "$dist_dir"

          mapfile -t files < <(
            find "$build_dir" -maxdepth 1 -type f \
              \( -name '*.bin' -o -name '*.elf' -o -name '*.map' \) \
              -printf '%f\n' | sort
          )

          for ext in bin elf map; do
            if ! printf '%s\n' "${files[@]}" | grep -q "\.${ext}$"; then
              echo "::error::No .${ext} file was produced for ${PROJECT}."
              exit 1
            fi
          done

          tar -czf "${dist_dir}/${PROJECT}-snapshot.tar.gz" \
            -C "$build_dir" "${files[@]}"

          echo "Created ${PROJECT}-snapshot.tar.gz:"
          tar -tzf "${dist_dir}/${PROJECT}-snapshot.tar.gz"

      - name: Upload ${{ matrix.project }} package
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.project }}
          path: ${{ runner.temp }}/dist/${{ matrix.project }}-snapshot.tar.gz
          if-no-files-found: error

  release:
    name: Publish testing release
    needs: [discover, build]
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download firmware packages
        uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          path: ${{ runner.temp }}/dist
          merge-multiple: true

      - name: Publish to the testing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          files=("${RUNNER_TEMP}"/dist/*-snapshot.tar.gz)
          if [[ ! -e "${files[0]}" ]]; then
            echo "::error::No firmware snapshot packages were downloaded."
            exit 1
          fi

          if ! gh release view testing >/dev/null 2>&1; then
            gh release create testing \
              --prerelease \
              --title "testing" \
              --notes "Automated firmware snapshots for tag \`testing\`." \
              --target "$GITHUB_SHA"
          fi

          gh release upload testing "${files[@]}" --clobber
